<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Posicionamento com Flex</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <!-- Space-between -->
    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>

    <!-- Space aroud -->
    <div class="itens-espacados">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>

    <!-- Center -->
    <div class="itens-centro">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>

    <!-- flex end -->
    <div class="itens-direita">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>


    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>

    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <div class="grupo-espacado amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>



    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>



    <div class="itens-espacados">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

    </div>


    <div class="itens-vertical">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="grupo-menor amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

        <div class="grupo-maior amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

    </div>

    <div class="itens-vertical">
        <div class="roxo">
            <img src="img/icone-bicicleta.png" alt="">

            <div class="grupo-maior amarelo">
                <img src="img/icone-bicicleta.png" alt="">
                <img id="fantasma" src="img/icone-fantasma.png" alt="">
                <img src="img/icone-hipopotamo.png" alt="">
            </div>
        </div>
        <div class="roxo">
            <div class="grupo-menor amarelo">
                <img id="fantasma" src="img/icone-fantasma.png" alt="">
                <img src="img/icone-hipopotamo.png" alt="">
            </div>
            <div class="grupo-menor amarelo">
                <img id="fantasma" src="img/icone-fantasma.png" alt="">
                <img src="img/icone-hipopotamo.png" alt="">
            </div>
            <div class="grupo-menor amarelo">
                <img id="fantasma" src="img/icone-fantasma.png" alt="">
                <img src="img/icone-hipopotamo.png" alt="">
            </div>
        </div>

    </div>






</body>

</html>
